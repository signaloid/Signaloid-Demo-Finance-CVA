on:
  workflow_dispatch:
  pull_request:

jobs:
  check-submodules:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Check common and compat submodules up to date
      run: |
        git clean -fdx
        git submodule foreach --recursive git clean -fdx
        git submodule foreach 'case "$sm_path" in submodules/common|submodules/compat) git fetch -fup origin "+refs/heads/*:refs/remotes/origin/*" ;; esac'
        git submodule update --remote --init -- submodules/common submodules/compat
        clean=$(git status --porcelain submodules/common submodules/compat)
        if [ "${clean}" == "" ]
        then
          echo "Submodules common and compat are up to date."
        else
          echo "Submodules are not up to date:"
          echo "${clean}"
          exit 1
        fi

  build-and-run-native-monte-carlo:
    runs-on: ubuntu-latest
    needs: check-submodules

    strategy:
      matrix:
        M: [1, 100]
        S: [0]

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        submodules: true

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgsl-dev libblas-dev gcc make

    - name: Compile application natively
      run: |
        make local-build

    - name: Run application
      run: |
        ./demo-native-mc \
          -M ${{ matrix.M }} -S ${{ matrix.S }}
